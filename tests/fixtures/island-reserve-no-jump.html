<!doctype html>
<html>
  <body>
    <!-- No mountly attribute reserves space: `style` already does it, and the
         core never touches the island element's own attributes. -->
    <div
      id="island"
      style="min-height: 40px"
      data-mountly="/tests/fixtures/w-echo.js"
      data-on="idle"
    >
      <span>Load</span>
    </div>
    <script type="module">
      const island = document.getElementById("island");
      const before = island.offsetHeight;
      addEventListener("mountly:mount", () => {
        window.__result = { before, after: island.offsetHeight };
      });
    </script>
    <script type="module" src="/packages/mountly/dist/auto.js"></script>
  </body>
</html>
