<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Payments embed</title>
    <script type="module" src="./dist/embed.js"></script>
  </head>
  <body>
    <acme-payments-summary balance="1250" currency="GBP"></acme-payments-summary>
    <p id="event" aria-live="polite"></p>
    <button id="refresh">Update balance</button>
    <script>
      const summary = document.querySelector("acme-payments-summary");
      summary.lineItems = [{ label: "Subscription", amount: 1200 }];
      summary.addEventListener("view-details", (event) => {
        document.querySelector("#event").textContent = `Selected balance: ${event.detail.balance}`;
      });
      document.querySelector("#refresh").addEventListener("click", () => {
        summary.balance = 1500;
      });
    </script>
  </body>
</html>
