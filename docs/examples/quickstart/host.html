<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mountly — quickstart host</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 42rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      button {
        padding: 0.5rem 1rem;
        font-weight: 600;
        cursor: pointer;
      }
      #mount {
        margin-top: 1rem;
        min-width: 320px;
        min-height: 240px;
        border: 1px dashed #94a3b8;
        border-radius: 8px;
      }
      /* the island's state is an attribute, so the loading affordance is CSS */
      [data-mountly-state="loading"] {
        opacity: 0.6;
      }
    </style>
    <!--
      Serve the REPOSITORY ROOT (not this file alone), e.g.:
        cd docs/examples/plain-html && pnpm dev
      then open:
        http://localhost:5175/docs/examples/quickstart/host.html

      No import map. The widget's self-contained build carries everything it
      needs, and mountly is loaded by URL.
    -->
  </head>
  <body>
    <h1>mountly quickstart</h1>
    <p>Hover the button to preload; click to mount. Click again to unmount.</p>

    <!-- The entire integration. No page JavaScript. -->
    <button
      type="button"
      id="trigger"
      data-mountly="/docs/examples/payment-breakdown/dist/index.js"
      data-preload="hover"
      data-target="#mount"
      data-toggle
      data-props='{"data":{"total":99,"currency":"USD","items":[{"description":"Pro plan","amount":99,"currency":"USD"}]}}'
    >
      View payment
    </button>
    <div id="mount"></div>

    <script type="module" src="/packages/mountly/dist/auto.js"></script>
  </body>
</html>
